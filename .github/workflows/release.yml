name: Publish Obsidian prerelease

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Validate version and build plugin
              run: |
                  node -e 'const fs = require("node:fs"); const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8")); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); if (process.env.GITHUB_REF_NAME !== manifest.version || pkg.version !== manifest.version) throw new Error("Tag, manifest, and package versions must match");'
                  npm ci
                  npm run build
                  npm test
                  npm run lint

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f release/podcast-capture/styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Upload assets and publish prerelease
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    --prerelease \
                    --verify-tag \
                    --notes-file=.github/prerelease-notes.md \
                    release/podcast-capture/main.js release/podcast-capture/manifest.json ${{ steps.styles.outputs.exists == 'true' && 'release/podcast-capture/styles.css' || '' }}

                  gh release edit "$tag" --draft=false --prerelease --latest=false
